<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서둥이네 한줄 일기장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase 설정 정보
        const SUPABASE_URL = "https://gookdripmzsaxfgfigai.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2G9uc2yJN0DSuzWo96WpAg_EoiVePJo";

        let supabaseClient = null;
        window.isCloudMode = false;

        // 클라이언트 초기화 시 스크립트 중단을 완전히 방지하는 안전 구문
        function initSupabaseSafe() {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function' && SUPABASE_URL && SUPABASE_KEY) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    window.isCloudMode = true;
                }
            } catch (err) {
                console.warn("Supabase 클라우드 접속 실패 (로컬 기기 저장 모드로 구동됩니다):", err);
                window.isCloudMode = false;
            }
        }

        // 일기 저장소 상태 변수
        let entries = [];
        let selectedAuthor = '아빠';
        let selectedTags = [];
        let currentPhotoBase64 = null;
        let editingEntryId = null; // 수정 중인 일기 ID/Timestamp

        // 초기화 로직
        window.addEventListener('DOMContentLoaded', () => {
            initSupabaseSafe();
            initializeApp();
            requestNotificationPermission(); // 웹 푸시 권한 확인
        });

        // 만약 DOMContentLoaded 타이밍을 놓쳤을 경우 대비 이중 초기화 보장
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(() => {
                if (!window.appInitialized) {
                    initSupabaseSafe();
                    initializeApp();
                    requestNotificationPermission();
                }
            }, 100);
        }

        // -------------------------------------------------------------
        // 웹 푸시 알림 (Web Push Notification) 지원
        // -------------------------------------------------------------
        function requestNotificationPermission() {
            if ("Notification" in window) {
                if (Notification.permission === "default") {
                    // 사용자 첫 방문 시 알림 권한 동의 요청
                    Notification.requestPermission().then(permission => {
                        updateNotificationBadge(permission);
                    });
                } else {
                    updateNotificationBadge(Notification.permission);
                }
            }
        }

        function updateNotificationBadge(permission) {
            const btn = document.getElementById('notifToggleBtn');
            if (!btn) return;
            if (permission === "granted") {
                btn.className = "text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full flex items-center gap-1";
                btn.innerHTML = `<i class="fa-solid fa-bell"></i> 알림 켜짐`;
            } else {
                btn.className = "text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full flex items-center gap-1 cursor-pointer";
                btn.innerHTML = `<i class="fa-solid fa-bell-slash"></i> 알림 켜기`;
                btn.onclick = () => {
                    Notification.requestPermission().then(p => updateNotificationBadge(p));
                };
            }
        }

        function sendWebPushNotification(authorName, textContent) {
            if ("Notification" in window && Notification.permission === "granted") {
                const title = `📝 서둥이네 일기장 새 소식!`;
                const options = {
                    body: `${authorName}님이 새 일기를 등록했어요:\n"${textContent.slice(0, 40)}..."`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3237/3237472.png',
                    badge: 'https://cdn-icons-png.flaticon.com/512/3237/3237472.png'
                };
                try {
                    new Notification(title, options);
                } catch (e) {
                    console.warn("웹 푸시 발송 실패:", e);
                }
            }
        }

        function subscribeRealtimeChanges() {
            if (window.isCloudMode && supabaseClient) {
                // Supabase 실시간 수신 구독 (가족이 일기를 쓸 때 즉시 푸시 알림)
                supabaseClient
                    .channel('public:journal_entries')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'journal_entries' }, payload => {
                        const newEntry = payload.new;
                        if (newEntry) {
                            const authorName = newEntry.author ? newEntry.author.name : '가족';
                            // 내가 쓴 글이 아닌 경우에만 웹푸시 알림 울리기
                            if (authorName !== (AUTHORS.find(a => a.id === selectedAuthor)?.name)) {
                                sendWebPushNotification(authorName, newEntry.content || '');
                            }
                            loadEntries();
                        }
                    })
                    .subscribe();
            }
        }

        function initializeApp() {
            if (window.appInitialized) return;
            window.appInitialized = true;

            // 상태 표시 업데이트
            const statusBadge = document.getElementById('cloudStatusBadge');
            if (statusBadge) {
                if (window.isCloudMode) {
                    statusBadge.className = "bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> 🟢 실시간 공유 중`;
                } else {
                    statusBadge.className = "bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> ● 내 기기 저장`;
                }
            }

            // 시계 및 날씨 업데이트
            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchWeather();

            // 작성자 태그 및 태그 선택기 초기화
            initAuthorSelector();
            initTagComboSelect();

            // 일기 데이터 로드 및 실시간 알림 구독
            loadEntries();
            subscribeRealtimeChanges();
        }
            }, 100);
        }

        function initializeApp() {
            if (window.appInitialized) return;
            window.appInitialized = true;

            // 상태 표시 업데이트
            const statusBadge = document.getElementById('cloudStatusBadge');
            if (statusBadge) {
                if (window.isCloudMode) {
                    statusBadge.className = "bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> 🟢 실시간 공유 중`;
                } else {
                    statusBadge.className = "bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> ● 내 기기 저장`;
                }
            }

            // 시계 및 날씨 업데이트
            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchWeather();

            // 작성자 태그 및 태그 선택기 초기화
            initAuthorSelector();
            initTagComboSelect();

            // 일기 데이터 로드
            loadEntries();
        }

        // -------------------------------------------------------------
        // 이미지 처리 (자동 용량 압축 적용)
        // -------------------------------------------------------------
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // 이미지 자동 리사이징 및 압축 (최대 1000px)
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1000;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // JPEG 0.7 품질로 데이터 압축
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const previewImg = document.getElementById('photoPreview');
                    const previewContainer = document.getElementById('photoPreviewContainer');
                    if (previewImg && previewContainer) {
                        previewImg.src = currentPhotoBase64;
                        previewContainer.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            currentPhotoBase64 = null;
            const previewContainer = document.getElementById('photoPreviewContainer');
            const fileInput = document.getElementById('photoInput');
            if (previewContainer) previewContainer.classList.add('hidden');
            if (fileInput) fileInput.value = '';
        }

        // -------------------------------------------------------------
        // 데이터 로드 & 저장 & 수정
        // -------------------------------------------------------------
        async function loadEntries() {
            if (window.isCloudMode && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('journal_entries')
                        .select('*')
                        .order('timestamp', { ascending: false });

                    if (!error && data) {
                        entries = data;
                        renderEntries();
                        return;
                    }
                } catch (err) {
                    console.warn("Supabase fetch failed, falling back to LocalStorage:", err);
                }
            }

            // LocalStorage Fallback
            const local = localStorage.getItem('seodung_journal_entries');
            entries = local ? JSON.parse(local) : [];
            renderEntries();
        }

        function editEntry(id, timestamp) {
            const entry = entries.find(e => (id && e.id === id) || (timestamp && e.timestamp === timestamp));
            if (!entry) return;

            editingEntryId = id || timestamp;
            selectedAuthor = entry.author ? entry.author.id : '아빠';
            selectedTags = entry.tags ? [...entry.tags] : [];
            currentPhotoBase64 = entry.imageUrl || null;

            // 폼 내용 채우기
            const contentInput = document.getElementById('journalContent');
            if (contentInput) contentInput.value = entry.content || '';

            initAuthorSelector();
            renderSelectedTags();

            const previewImg = document.getElementById('photoPreview');
            const previewContainer = document.getElementById('photoPreviewContainer');
            if (currentPhotoBase64 && previewImg && previewContainer) {
                previewImg.src = currentPhotoBase64;
                previewContainer.classList.remove('hidden');
            } else if (previewContainer) {
                previewContainer.classList.add('hidden');
            }

            // 등록 버튼 텍스트 변경 및 화면 스크롤
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerHTML = `<i class="fa-solid fa-check text-xl"></i> 수정 완료`;
                submitBtn.className = "flex-[2] py-3.5 px-4 rounded-xl bg-amber-500 text-white font-bold text-lg flex items-center justify-center gap-2 shadow-amber-200 shadow-lg hover:bg-amber-600 active:scale-95 transition-all";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingEntryId = null;
            const contentInput = document.getElementById('journalContent');
            if (contentInput) contentInput.value = '';
            selectedTags = [];
            renderSelectedTags();
            removePhoto();

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 등록하기`;
                submitBtn.className = "flex-[2] py-3.5 px-4 rounded-xl bg-indigo-600 text-white font-bold text-lg flex items-center justify-center gap-2 shadow-indigo-200 shadow-lg hover:bg-indigo-700 active:scale-95 transition-all";
            }
        }

        async function saveEntry() {
            const contentInput = document.getElementById('journalContent');
            const content = contentInput ? contentInput.value.trim() : '';

            if (!content) {
                alert("일기 내용을 입력해 주세요!");
                return;
            }

            const authorObj = AUTHORS.find(a => a.id === selectedAuthor) || AUTHORS[0];
            const dtText = document.getElementById('currentDateTime')?.textContent || '';
            const weatherHTML = document.getElementById('weatherInfo')?.innerHTML || '';

            // 수정 모드인 경우
            if (editingEntryId !== null) {
                const targetEntry = entries.find(e => (e.id && e.id === editingEntryId) || (e.timestamp && e.timestamp === editingEntryId));
                if (targetEntry) {
                    targetEntry.author = authorObj;
                    targetEntry.tags = [...selectedTags];
                    targetEntry.content = content;
                    targetEntry.imageUrl = currentPhotoBase64;

                    if (window.isCloudMode && supabaseClient && targetEntry.id) {
                        try {
                            await supabaseClient
                                .from('journal_entries')
                                .update({
                                    author: authorObj,
                                    tags: [...selectedTags],
                                    content: content,
                                    imageUrl: currentPhotoBase64
                                })
                                .eq('id', targetEntry.id);
                        } catch (err) {
                            console.error("클라우드 수정 실패:", err);
                        }
                    }
                    saveToLocalStorage();
                }
                cancelEdit();
                renderEntries();
                return;
            }

            // 신규 작성 모드인 경우
            const newEntry = {
                timestamp: Date.now(),
                author: authorObj,
                dateTimeStr: dtText,
                weather: { html: weatherHTML },
                tags: [...selectedTags],
                content: content,
                imageUrl: currentPhotoBase64
            };

            if (window.isCloudMode && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('journal_entries')
                        .insert([newEntry])
                        .select();

                    if (error) throw error;
                    if (data && data[0]) {
                        entries.unshift(data[0]);
                    } else {
                        entries.unshift(newEntry);
                    }
                } catch (err) {
                    console.error("클라우드 저장 실패, 로컬에 저장합니다:", err);
                    entries.unshift(newEntry);
                    saveToLocalStorage();
                }
            } else {
                entries.unshift(newEntry);
                saveToLocalStorage();
            }

            cancelEdit();
            renderEntries();
        }

        function saveToLocalStorage() {
            localStorage.setItem('seodung_journal_entries', JSON.stringify(entries));
        }

        async function deleteEntry(id, timestamp) {
            if (!confirm("이 일기를 삭제하시겠습니까?")) return;

            if (window.isCloudMode && supabaseClient && id) {
                try {
                    await supabaseClient
                        .from('journal_entries')
                        .delete()
                        .eq('id', id);
                } catch (err) {
                    console.error("클라우드 삭제 실패:", err);
                }
            }

            entries = entries.filter(e => e.id ? e.id !== id : e.timestamp !== timestamp);
            saveToLocalStorage();
            renderEntries();
        }

        // -------------------------------------------------------------
        // 목록 렌더링
        // -------------------------------------------------------------
        function renderEntries() {
            const container = document.getElementById('entriesContainer');
            if (!container) return;
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-lg font-medium">아직 등록된 일기가 없습니다.</p>
                        <p class="text-sm text-slate-400 mt-1">오늘의 한 줄 일기를 처음 작성해 보세요!</p>
                    </div>
                `;
                return;
            }

            entries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col gap-3 hover:shadow-md transition-shadow';

                const author = entry.author || { name: '가족', icon: 'fa-user', bgLight: 'bg-slate-50', text: 'text-slate-600', border: 'border-slate-300' };

                let tagsHTML = '';
                if (entry.tags && entry.tags.length > 0) {
                    tagsHTML = `<div class="flex flex-wrap gap-1.5 mt-1">` +
                        entry.tags.map(t => `<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">${t}</span>`).join('') +
                        `</div>`;
                }

                let imageHTML = '';
                if (entry.imageUrl) {
                    imageHTML = `
                        <div class="mt-2 rounded-xl overflow-hidden max-h-80 border border-slate-100 bg-slate-50 flex items-center justify-center">
                            <img src="${entry.imageUrl}" alt="일기 사진" class="w-full h-auto object-cover max-h-80">
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-9 h-9 rounded-full ${author.bgLight} ${author.text} flex items-center justify-center text-lg font-bold border ${author.border}">
                                <i class="fa-solid ${author.icon}"></i>
                            </span>
                            <div>
                                <span class="font-bold text-slate-800 text-base">${author.name}</span>
                                <span class="text-xs text-slate-400 block">${entry.dateTimeStr || ''}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="editEntry(${entry.id || 'null'}, ${entry.timestamp})" class="text-slate-400 hover:text-indigo-600 p-2 transition-colors" title="수정">
                                <i class="fa-solid fa-pen text-lg"></i>
                            </button>
                            <button onclick="deleteEntry(${entry.id || 'null'}, ${entry.timestamp})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors" title="삭제">
                                <i class="fa-solid fa-trash-can text-lg"></i>
                            </button>
                        </div>
                    </div>

                    ${tagsHTML}

                    <p class="text-slate-700 text-lg font-normal leading-relaxed whitespace-pre-wrap">${entry.content}</p>

                    ${imageHTML}
                `;

                container.appendChild(card);
            });
        }

        // -------------------------------------------------------------
        // 백업 & 복원
        // -------------------------------------------------------------
        function downloadBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `서둥이네_일기장_백업_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function uploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedEntries = JSON.parse(e.target.result);
                    if (Array.isArray(importedEntries)) {
                        entries = importedEntries;
                        saveToLocalStorage();
                        renderEntries();
                        alert("백업 파일 데이터를 성공적으로 불러왔습니다!");
                    } else {
                        alert("올바르지 않은 백업 파일 형식입니다.");
                    }
                } catch (err) {
                    alert("파일을 읽는 도중 오류가 발생했습니다.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-['Noto_Sans_KR'] antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-lg border-x border-slate-200">
        
        <!-- Header -->
        <header class="bg-white p-4 border-b border-slate-200 sticky top-0 z-10 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-indigo-200 shadow-md">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-800 tracking-tight leading-none">서둥이네 한줄 일기장</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <p class="text-xs text-slate-400">우리 가족 하루 기록하기</p>
                        <button id="notifToggleBtn" class="text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full flex items-center gap-1">
                            <i class="fa-solid fa-bell"></i> 알림 권한
                        </button>
                    </div>
                </div>
            </div>
            <div id="cloudStatusBadge" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> 연결 확인 중
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 p-4 flex flex-col gap-4">
            
            <!-- 작성자 선택 -->
            <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <label class="block text-sm font-bold text-slate-500 mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-tag text-indigo-500"></i> 작성자 선택
                </label>
                <div id="authorSelector" class="flex gap-2"></div>
            </section>

            <!-- 일시 및 날씨 -->
            <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-sm font-semibold text-slate-600">
                <div class="flex items-center gap-2 text-base">
                    <i class="fa-regular fa-calendar-days text-indigo-500 text-lg"></i>
                    <span id="currentDateTime">2026.11.08(일) 00:00</span>
                </div>
                <div id="weatherInfo" class="flex items-center gap-1 text-slate-600"></div>
            </section>

            <!-- 기분 & 활동 콤보박스 -->
            <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-3">
                <label class="block text-sm font-bold text-slate-500 flex items-center gap-1.5">
                    <i class="fa-solid fa-face-smile text-amber-500 text-base"></i> 기분 & 활동 선택
                </label>
                <select id="tagComboSelect" onchange="handleTagSelect(event)" class="w-full p-3.5 rounded-xl border border-slate-300 text-slate-700 bg-slate-50 font-medium text-base focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
                <div id="selectedTagsContainer" class="flex flex-wrap gap-2 min-h-[32px] items-center"></div>
            </section>

            <!-- 일기 입력 & 사진 첨부 -->
            <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <label class="block text-sm font-bold text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 오늘 일기쓰기
                    </label>
                    <span class="text-xs text-indigo-500 font-bold">* 하루 한 장 사진 첨부 가능</span>
                </div>
                
                <textarea id="journalContent" rows="4" placeholder="오늘 어떤 일이 있었나요? 편하게 적어보세요..." class="w-full p-3.5 rounded-xl border border-slate-200 text-slate-800 text-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none leading-relaxed"></textarea>

                <!-- 사진 미리보기 -->
                <div id="photoPreviewContainer" class="relative hidden rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
                    <img id="photoPreview" src="" alt="첨부 사진 미리보기" class="w-full max-h-56 object-cover">
                    <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-slate-900/70 text-white flex items-center justify-center hover:bg-rose-600 transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- 하단 버튼들 -->
                <div class="flex items-center gap-2 pt-1">
                    <label for="photoInput" class="flex-1 py-3 px-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-700 font-bold text-base flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-camera text-indigo-500 text-lg"></i> 사진 첨부
                    </label>
                    <input type="file" id="photoInput" accept="image/*" onchange="handleImageSelect(event)" class="hidden">

                    <button type="button" id="submitBtn" onclick="saveEntry()" class="flex-[2] py-3.5 px-4 rounded-xl bg-indigo-600 text-white font-bold text-lg flex items-center justify-center gap-2 shadow-indigo-200 shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                        <i class="fa-solid fa-paper-plane"></i> 등록하기
                    </button>
                </div>
            </section>

            <!-- 백업/불러오기 -->
            <section class="flex gap-2">
                <button type="button" onclick="downloadBackup()" class="flex-1 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold text-sm flex items-center justify-center gap-1.5 hover:bg-slate-50">
                    <i class="fa-solid fa-download text-indigo-500"></i> 백업 받기
                </button>
                <label for="backupInput" class="flex-1 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold text-sm flex items-center justify-center gap-1.5 hover:bg-slate-50 cursor-pointer">
                    <i class="fa-solid fa-upload text-indigo-500"></i> 불러오기
                </label>
                <input type="file" id="backupInput" accept=".json" onchange="uploadBackup(event)" class="hidden">
            </section>

            <!-- 일기 리스트 -->
            <section class="flex flex-col gap-3 mt-2">
                <h2 class="text-sm font-bold text-slate-500 flex items-center gap-1.5 px-1">
                    <i class="fa-solid fa-list-ul text-indigo-500"></i> 우리 가족 일기 목록
                </h2>
                <div id="entriesContainer" class="flex flex-col gap-3"></div>
            </section>
        </main>
    </div>
</body>
</html>
