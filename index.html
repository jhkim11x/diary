<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서둥이네 한줄 일기장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-author { border-color: #4f46e5 !important; background-color: #eef2ff !important; color: #4f46e5 !important; font-weight: 700; }
        button, a { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; text-decoration: none !important; }
        button:hover, button:focus, button:active { text-decoration: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4 space-y-4">
        <!-- Header -->
        <header class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-slate-100">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">📖</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">서둥이네 한줄 일기장</h1>
                    <p class="text-xs text-slate-500">우리 가족 하루 기록하기</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="requestNotification()" id="notifBtn" class="p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 text-sm">🔔</button>
                <div id="syncStatus" class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm" title="실시간 공유 연결됨"></div>
            </div>
        </header>

        <!-- Author Selection -->
        <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
            <label class="block text-xs font-semibold text-slate-400 mb-2">👤 작성자 선택</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setAuthor('아빠', this)" class="author-btn py-2 px-3 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 flex items-center justify-center space-x-1.5"><span>👨</span><span>아빠</span></button>
                <button onclick="setAuthor('엄마', this)" class="author-btn py-2 px-3 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 flex items-center justify-center space-x-1.5"><span>👩</span><span>엄마</span></button>
                <button onclick="setAuthor('딸', this)" class="author-btn py-2 px-3 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 flex items-center justify-center space-x-1.5"><span>👧</span><span>딸</span></button>
            </div>
        </section>

        <!-- Date & Weather Info -->
        <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between text-xs text-slate-600">
            <span id="currentDateDisp">📅 날짜 로딩중...</span>
            <span id="weatherDisp">☀️ 맑음</span>
        </div>

        <!-- Mood & Activity Selection -->
        <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
            <label class="block text-xs font-semibold text-slate-400 mb-2">😊 기분 & 활동 선택</label>
            <select id="moodSelect" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                <option value="행복 ☺️">행복 ☺️</option>
                <option value="기쁨 🎉">기쁨 🎉</option>
                <option value="평온 😌">평온 😌</option>
                <option value="피곤 🥱">피곤 🥱</option>
                <option value="슬픔 😢">슬픔 😢</option>
                <option value="화남 😡">화남 😡</option>
            </select>
        </section>

        <!-- Write Entry -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-slate-400">✍️ 오늘 일기쓰기</label>
                <span class="text-[10px] text-slate-400">* 사진 1장 첨부 가능</span>
            </div>
            <textarea id="diaryContent" rows="3" class="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 resize-none" placeholder="오늘 어떤 일이 있었나요? 편하게 적어보세요..."></textarea>
            
            <div id="imagePreviewContainer" class="hidden relative">
                <img id="imagePreview" class="w-full h-32 object-cover rounded-xl border border-slate-100">
                <button onclick="removeImage()" class="absolute top-2 right-2 bg-black/60 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center">✕</button>
            </div>

            <div class="flex items-center space-x-2">
                <label class="flex-1 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-xl cursor-pointer text-center transition">
                    📸 사진 첨부
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
                <button onclick="saveDiary()" class="flex-1 py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm shadow-indigo-200 transition">
                    📝 등록하기
                </button>
            </div>
        </section>

        <!-- Diary List -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-700">📖 우리 가족 일기 목록</h2>
                <button onclick="loadDiaries()" class="text-xs text-indigo-600 font-semibold hover:text-indigo-700 flex items-center space-x-1">
                    <span>새로고침</span>
                </button>
            </div>
            <div id="diaryList" class="space-y-3">
                <div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs border border-slate-100">
                    일기를 불러오는 중입니다... ⏳
                </div>
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = "https://gookdripmzsaxfgfigai.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2G9uc2yJN0DSuzWo96WpAg_EoiVePJo";
        
        let currentAuthor = localStorage.getItem("family_journal_author") || "아빠";
        let uploadedImageBase64 = null;
        let editingId = null;

        window.addEventListener("DOMContentLoaded", () => {
            initDate();
            initAuthorUI();
            loadDiaries();
            setInterval(loadDiaries, 5000); // 5초마다 자동 실시간 동기화
        });

        function initDate() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}(${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('currentDateDisp').innerText = `📅 ${dateStr}`;
        }

        function initAuthorUI() {
            document.querySelectorAll('.author-btn').forEach(btn => {
                if(btn.innerText.includes(currentAuthor)) {
                    btn.classList.add('active-author');
                } else {
                    btn.classList.remove('active-author');
                }
            });
        }

        function setAuthor(author, btn) {
            currentAuthor = author;
            localStorage.setItem("family_journal_author", author);
            document.querySelectorAll('.author-btn').forEach(b => b.classList.remove('active-author'));
            btn.classList.add('active-author');
            renderDiaryList(window.cachedDiaries || []);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageBase64 = e.target.result;
                document.getElementById('imagePreview').src = uploadedImageBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        function removeImage() {
            uploadedImageBase64 = null;
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        async function loadDiaries() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/journal_entries?select=*&order=id.desc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    window.cachedDiaries = data;
                    renderDiaryList(data);
                }
            } catch(e) {
                console.error("동기화 오류:", e);
            }
        }

        function renderDiaryList(diaries) {
            const container = document.getElementById('diaryList');
            if(!diaries || diaries.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs border border-slate-100">아직 공유된 일기가 없습니다.<br>첫 번째 일기를 남겨보세요! ✍️</div>`;
                return;
            }

            container.innerHTML = diaries.map(item => {
                const authorEmoji = item.author === '아빠' ? '👨' : item.author === '엄마' ? '👩' : '👧';
                const isOwner = item.author === currentAuthor;

                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs">${authorEmoji}</span>
                                <span class="font-bold text-xs text-slate-800">${item.author}</span>
                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-600">${item.mood || ''}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] text-slate-400">${item.date || ''}</span>
                                ${isOwner ? `
                                    <button onclick="editDiary(${item.id}, \`${encodeURIComponent(item.content || '')}\`, \`${item.mood || ''}\`)" class="text-slate-400 hover:text-indigo-600 text-xs p-1">✏️</button>
                                    <button onclick="deleteDiary(${item.id})" class="text-slate-400 hover:text-rose-500 text-xs p-1">✕</button>
                                ` : ''}
                            </div>
                        </div>
                        <p class="text-xs text-slate-700 whitespace-pre-line leading-relaxed">${item.content || ''}</p>
                        ${item.photo ? `<img src="${item.photo}" class="w-full h-40 object-cover rounded-xl mt-2 border border-slate-50">` : ''}
                    </div>
                `;
            }).join('');
        }

        async function saveDiary() {
            const content = document.getElementById('diaryContent').value.trim();
            const mood = document.getElementById('moodSelect').value;
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if(!content && !uploadedImageBase64) {
                alert("일기 내용이나 사진을 입력해주세요!");
                return;
            }

            const payload = {
                author: currentAuthor,
                content: content,
                mood: mood,
                photo: uploadedImageBase64 || "",
                date: dateStr
            };

            try {
                let url = `${SUPABASE_URL}/rest/v1/journal_entries`;
                let method = "POST";
                let headers = {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                };

                if(editingId) {
                    url += `?id=eq.${editingId}`;
                    method = "PATCH";
                }

                const res = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    document.getElementById('diaryContent').value = "";
                    removeImage();
                    editingId = null;
                    loadDiaries();
                } else {
                    alert("저장에 실패했습니다.");
                }
            } catch(e) {
                alert("네트워크 오류가 발생했습니다.");
            }
        }

        function editDiary(id, encodedContent, mood) {
            editingId = id;
            document.getElementById('diaryContent').value = decodeURIComponent(encodedContent);
            document.getElementById('moodSelect').value = mood;
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        async function deleteDiary(id) {
            if(!confirm("정말 이 일기를 삭제하시겠습니까?")) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/journal_entries?id=eq.${id}`, {
                    method: "DELETE",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                if(res.ok) {
                    loadDiaries();
                } else {
                    alert("삭제에 실패했습니다.");
                }
            } catch(e) {
                alert("네트워크 오류 발생");
            }
        }

        function requestNotification() {
            if (!("Notification" in window)) {
                alert("이 브라우저는 알림을 지원하지 않습니다.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("🔔 가족 알림이 허용되었습니다!");
                } else {
                    alert("알림 권한이 거부되었습니다.");
                }
            });
        }
    </script>
</body>
</html>
