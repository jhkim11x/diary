<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%EC%84%9C%EB%93%A1%EC%9D%B4%EB%84%A4%20%ED%95%9C%EC%A5%B4%20%EC%9D%BC%EA%B8%B0%EC%9E%A5%22%2C%22short_name%22%3A%22%EC%9D%BC%EA%B8%B0%EC%9E%A5%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">

    <title>서둥이네 한줄 일기장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // -------------------------------------------------------------
        // Supabase 설정 및 기본 데이터 정의
        // -------------------------------------------------------------
        const SUPABASE_URL = "https://gookdripmzsaxfgfigai.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2G9uc2yJN0DSuzWo96WpAg_EoiVePJo";

        let supabaseClient = null;
        window.isCloudMode = false;

        const AUTHORS = [
            { id: '아빠', name: '아빠', icon: 'fa-user-tie', color: 'bg-blue-500', text: 'text-blue-600', bgLight: 'bg-blue-50', border: 'border-blue-200' },
            { id: '엄마', name: '엄마', icon: 'fa-user-nurse', color: 'bg-pink-500', text: 'text-pink-600', bgLight: 'bg-pink-50', border: 'border-pink-200' },
            { id: '딸', name: '딸', icon: 'fa-user-ninja', color: 'bg-purple-500', text: 'text-purple-600', bgLight: 'bg-purple-50', border: 'border-purple-200' }
        ];

        const REACTION_ICONS = ['😊', '👍', '👎', '❤️', '🎉'];

        const TAG_CATEGORIES = [
            { label: '😊 기분 선택', tags: ['행복 😊', '기쁨 😆', '신남 🎉', '슬픔 😢', '서운 🥺', '평온 🌿', '피곤 😴', '우울 🌧️', '뿌듯 ✨', '감사 🙏'] },
            { label: '⚽ 활동 선택', tags: ['가족 나들이 🚗', '맛있는 식사 🍕', '운동/산책 🏃', '영화/TV 🎬', '휴식 ☕', '쇼핑 🛍️', '공부/독서 📚'] }
        ];

        let entries = [];
        let selectedAuthor = '아빠';
        let selectedTags = [];
        let currentPhotoBase64 = null;
        let editingEntryId = null;

        let selectedCommentEmojis = {};
        let openCommentBoxes = {};

        // -------------------------------------------------------------
        // Supabase 안전 연결 초기화
        // -------------------------------------------------------------
        function initSupabaseSafe() {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function' && SUPABASE_URL && SUPABASE_KEY) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    window.isCloudMode = true;
                }
            } catch (err) {
                console.warn("Supabase 연결 실패:", err);
                window.isCloudMode = false;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initSupabaseSafe();
            initializeApp();
            requestNotificationPermission();
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(() => {
                if (!window.appInitialized) {
                    initSupabaseSafe();
                    initializeApp();
                    requestNotificationPermission();
                }
            }, 100);
        }

        async function initializeApp() {
            if (window.appInitialized) return;
            window.appInitialized = true;

            const statusBadge = document.getElementById('cloudStatusBadge');
            if (statusBadge) {
                if (window.isCloudMode) {
                    statusBadge.className = "w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs font-bold border border-emerald-200 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>`;
                    statusBadge.title = "실시간 공유 중";
                } else {
                    statusBadge.className = "w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold border border-slate-200 shadow-sm";
                    statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>`;
                    statusBadge.title = "로컬 모드";
                }
            }

            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchWeather();

            initAuthorSelector();
            initTagComboSelect();
            
            // 앱 켤 때 서버 데이터를 최우선으로 가져오고 로컬과 병합
            await loadEntries();
            
            // 실시간 변경 구독 (다른 폰에서 등록/수정/삭제 시 즉시 반영)
            subscribeRealtimeChanges();
        }

        function subscribeRealtimeChanges() {
            if (window.isCloudMode && supabaseClient) {
                supabaseClient
                    .channel('public:journal_entries')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'journal_entries' }, payload => {
                        loadEntries();
                    })
                    .subscribe();
            }
        }

        // -------------------------------------------------------------
        // 클라우드 & 로컬 통합 데이터 로드 함수
        // -------------------------------------------------------------
        async function loadEntries() {
            let cloudEntries = [];
            
            // 1. 클라우드 서버에서 데이터 가져오기 시도
            if (window.isCloudMode && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('journal_entries')
                        .select('*')
                        .order('timestamp', { ascending: false });

                    if (!error && data) {
                        cloudEntries = data;
                    }
                } catch (err) {
                    console.warn("서버 데이터 로드 중 오류:", err);
                }
            }

            // 2. 로컬 저장소 데이터 가져오기
            let localEntries = [];
            const local = localStorage.getItem('seodung_journal_entries');
            if (local) {
                try {
                    localEntries = JSON.parse(local);
                } catch (e) {
                    localEntries = [];
                }
            }

            // 3. 서버 데이터와 로컬 데이터를 하나로 병합 (중복 제거 및 최신 정렬)
            const map = new Map();
            
            // 로컬 데이터 먼저 세팅
            localEntries.forEach(item => {
                const key = item.id || item.timestamp;
                if (key) map.set(String(key), item);
            });

            // 서버 데이터로 덮어씌워 최신화 (아내분 폰에서 쓴 글도 여기서 들어옴)
            cloudEntries.forEach(item => {
                const key = item.id || item.timestamp;
                if (key) map.set(String(key), item);
            });

            entries = Array.from(map.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            saveToLocalStorage();
            renderEntries();
        }

        // -------------------------------------------------------------
        // 날짜 & 시계 & 날씨
        // -------------------------------------------------------------
        function updateDateTime() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const day = days[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const element = document.getElementById('currentDateTime');
            if (element) {
                element.textContent = `${year}.${month}.${date}(${day}) ${hours}:${minutes}`;
            }
        }

        async function fetchWeather() {
            const weatherEl = document.getElementById('weatherInfo');
            if (!weatherEl) return;
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    let icon = 'fa-sun text-amber-500';
                    let text = '맑음';
                    if (code > 0 && code <= 3) { icon = 'fa-cloud-sun text-slate-400'; text = '구름조금'; }
                    else if (code > 3 && code < 60) { icon = 'fa-cloud text-slate-500'; text = '흐림'; }
                    else if (code >= 60) { icon = 'fa-umbrella text-blue-500'; text = '비'; }

                    weatherEl.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${text} ${temp}°C</span>`;
                }
            } catch (e) {
                weatherEl.innerHTML = `<i class="fa-solid fa-sun text-amber-500"></i> <span>맑음 20°C</span>`;
            }
        }

        // -------------------------------------------------------------
        // 작성자 및 태그 선택기
        // -------------------------------------------------------------
        function initAuthorSelector() {
            const container = document.getElementById('authorSelector');
            if (!container) return;
            container.innerHTML = '';

            AUTHORS.forEach(author => {
                const isSelected = author.id === selectedAuthor;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `flex-1 py-2 px-2.5 rounded-xl border flex items-center justify-center gap-1.5 font-bold text-xs transition-all ${
                    isSelected 
                    ? `${author.color} text-white border-transparent shadow-sm scale-102` 
                    : `bg-white ${author.text} border-slate-200 hover:bg-slate-50`
                }`;
                btn.innerHTML = `<i class="fa-solid ${author.icon}"></i> ${author.name}`;
                btn.onclick = () => {
                    selectedAuthor = author.id;
                    initAuthorSelector();
                };
                container.appendChild(btn);
            });
        }

        function initTagComboSelect() {
            const select = document.getElementById('tagComboSelect');
            if (!select) return;
            select.innerHTML = '<option value="">-- 기분 또는 활동을 선택하세요 --</option>';

            TAG_CATEGORIES.forEach(cat => {
                const group = document.createElement('optgroup');
                group.label = cat.label;
                cat.tags.forEach(tag => {
                    const opt = document.createElement('option');
                    opt.value = tag;
                    opt.textContent = tag;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            });
        }

        function handleTagSelect(event) {
            const val = event.target.value;
            if (val && !selectedTags.includes(val)) {
                selectedTags.push(val);
                renderSelectedTags();
            }
            event.target.value = '';
        }

        function removeTag(tagToRemove) {
            selectedTags = selectedTags.filter(t => t !== tagToRemove);
            renderSelectedTags();
        }

        function renderSelectedTags() {
            const container = document.getElementById('selectedTagsContainer');
            if (!container) return;
            container.innerHTML = '';
            selectedTags.forEach(tag => {
                const badge = document.createElement('span');
                badge.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-200";
                badge.innerHTML = `${tag} <i class="fa-solid fa-xmark cursor-pointer hover:text-rose-500" onclick="removeTag('${tag}')"></i>`;
                container.appendChild(badge);
            });
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                if (Notification.permission === "default") {
                    Notification.requestPermission().then(p => updateNotificationBadge(p));
                } else {
                    updateNotificationBadge(Notification.permission);
                }
            }
        }

        function updateNotificationBadge(permission) {
            const btn = document.getElementById('notifToggleBtn');
            if (!btn) return;
            if (permission === "granted") {
                btn.className = "w-7 h-7 rounded-full text-emerald-600 bg-emerald-50 border border-emerald-200 flex items-center justify-center hover:bg-emerald-100 transition-colors";
                btn.innerHTML = `<i class="fa-solid fa-bell text-xs"></i>`;
                btn.title = "알림 켜짐";
            } else {
                btn.className = "w-7 h-7 rounded-full text-slate-400 bg-slate-50 border border-slate-200 flex items-center justify-center hover:bg-slate-100 transition-colors cursor-pointer";
                btn.innerHTML = `<i class="fa-solid fa-bell-slash text-xs"></i>`;
                btn.title = "알림 켜기";
                btn.onclick = () => {
                    Notification.requestPermission().then(p => updateNotificationBadge(p));
                };
            }
        }

        // -------------------------------------------------------------
        // 이미지 처리
        // -------------------------------------------------------------
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const previewImg = document.getElementById('photoPreview');
                    const previewContainer = document.getElementById('photoPreviewContainer');
                    if (previewImg && previewContainer) {
                        previewImg.src = currentPhotoBase64;
                        previewContainer.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            currentPhotoBase64 = null;
            const previewContainer = document.getElementById('photoPreviewContainer');
            const fileInput = document.getElementById('photoInput');
            if (previewContainer) previewContainer.classList.add('hidden');
            if (fileInput) fileInput.value = '';
        }

        // -------------------------------------------------------------
        // 데이터 CRUD (서버 동기화 우선 처리)
        // -------------------------------------------------------------
        function saveToLocalStorage() {
            localStorage.setItem('seodung_journal_entries', JSON.stringify(entries));
        }

        function editEntry(id, timestamp) {
            const entry = entries.find(e => (id && String(e.id) === String(id)) || (timestamp && Number(e.timestamp) === Number(timestamp)));
            if (!entry) return;

            editingEntryId = id || timestamp;
            selectedAuthor = entry.author ? entry.author.id : '아빠';
            selectedTags = entry.tags ? [...entry.tags] : [];
            currentPhotoBase64 = entry.imageUrl || null;

            const contentInput = document.getElementById('journalContent');
            if (contentInput) contentInput.value = entry.content || '';

            initAuthorSelector();
            renderSelectedTags();

            const previewImg = document.getElementById('photoPreview');
            const previewContainer = document.getElementById('photoPreviewContainer');
            if (currentPhotoBase64 && previewImg && previewContainer) {
                previewImg.src = currentPhotoBase64;
                previewContainer.classList.remove('hidden');
            } else if (previewContainer) {
                previewContainer.classList.add('hidden');
            }

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerHTML = `<i class="fa-solid fa-check text-lg"></i> 수정 완료`;
                submitBtn.className = "flex-[2] py-2.5 px-3 rounded-xl bg-amber-500 text-white font-bold text-sm flex items-center justify-center gap-1.5 shadow-amber-100 shadow-md hover:bg-amber-600 active:scale-95 transition-all";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingEntryId = null;
            const contentInput = document.getElementById('journalContent');
            if (contentInput) contentInput.value = '';
            selectedTags = [];
            renderSelectedTags();
            removePhoto();

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane text-xs"></i> 등록하기`;
                submitBtn.className = "flex-[2] py-2.5 px-3 rounded-xl bg-indigo-600 text-white font-bold text-sm flex items-center justify-center gap-1.5 shadow-indigo-100 shadow-md hover:bg-indigo-700 active:scale-95 transition-all";
            }
        }

        async function saveEntry() {
            const contentInput = document.getElementById('journalContent');
            const content = contentInput ? contentInput.value.trim() : '';

            if (!content) {
                alert("일기 내용을 입력해 주세요!");
                return;
            }

            const authorObj = AUTHORS.find(a => a.id === selectedAuthor) || AUTHORS[0];
            const dtText = document.getElementById('currentDateTime')?.textContent || '';

            if (editingEntryId !== null) {
                const targetEntry = entries.find(e => (e.id && String(e.id) === String(editingEntryId)) || (e.timestamp && Number(e.timestamp) === Number(editingEntryId)));
                if (targetEntry) {
                    targetEntry.author = authorObj;
                    targetEntry.tags = [...selectedTags];
                    targetEntry.content = content;
                    targetEntry.imageUrl = currentPhotoBase64;

                    saveToLocalStorage();
                    renderEntries();

                    if (window.isCloudMode && supabaseClient && targetEntry.id) {
                        try {
                            await supabaseClient
                                .from('journal_entries')
                                .update({
                                    author: authorObj,
                                    tags: [...selectedTags],
                                    content: content,
                                    imageUrl: currentPhotoBase64
                                })
                                .eq('id', targetEntry.id);
                        } catch (err) {
                            console.warn("클라우드 수정 실패:", err);
                        }
                    }
                }
                cancelEdit();
                return;
            }

            const newEntry = {
                timestamp: Date.now(),
                author: authorObj,
                dateTimeStr: dtText,
                tags: [...selectedTags],
                content: content,
                imageUrl: currentPhotoBase64,
                comments: []
            };

            // 1. 로컬에 우선 반영
            entries.unshift(newEntry);
            saveToLocalStorage();
            renderEntries();
            cancelEdit();

            // 2. 서버에 전송하여 아내분 폰과 실시간 공유
            if (window.isCloudMode && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('journal_entries')
                        .insert([newEntry])
                        .select();

                    if (!error && data && data[0]) {
                        entries[0] = data[0];
                        saveToLocalStorage();
                        renderEntries();
                    }
                } catch (err) {
                    console.warn("클라우드 저장 실패:", err);
                }
            }
        }

        async function deleteEntry(id, timestamp) {
            if (!confirm("이 일기를 삭제하시겠습니까?")) return;

            entries = entries.filter(e => {
                if (id && e.id) return String(e.id) !== String(id);
                return Number(e.timestamp) !== Number(timestamp);
            });
            saveToLocalStorage();
            renderEntries();

            if (window.isCloudMode && supabaseClient && id) {
                try {
                    await supabaseClient
                        .from('journal_entries')
                        .delete()
                        .eq('id', id);
                } catch (err) {
                    console.warn("클라우드 삭제 실패:", err);
                }
            }
        }

        // -------------------------------------------------------------
        // 댓글 및 이모지 반응 (서버 동기화 포함)
        // -------------------------------------------------------------
        function toggleCommentInput(entryIdKey) {
            openCommentBoxes[entryIdKey] = !openCommentBoxes[entryIdKey];
            renderEntries();
        }

        function selectCommentEmoji(entryIdKey, emoji) {
            if (selectedCommentEmojis[entryIdKey] === emoji) {
                delete selectedCommentEmojis[entryIdKey];
            } else {
                selectedCommentEmojis[entryIdKey] = emoji;
            }
            renderEntries();
        }

        async function addComment(entryId, timestamp) {
            const entryIdKey = entryId || timestamp;
            const inputEl = document.getElementById(`commentInput_${entryIdKey}`);
            const text = inputEl ? inputEl.value.trim() : '';
            const emoji = selectedCommentEmojis[entryIdKey] || '';

            if (!text && !emoji) {
                alert("이모지를 선택하거나 댓글을 입력해 주세요!");
                return;
            }

            const authorObj = AUTHORS.find(a => a.id === selectedAuthor) || AUTHORS[0];
            const commentObj = {
                id: Date.now(),
                author: authorObj,
                emoji: emoji,
                text: text
            };

            delete selectedCommentEmojis[entryIdKey];
            await pushCommentToEntry(entryId, timestamp, commentObj);
        }

        async function pushCommentToEntry(entryId, timestamp, commentObj) {
            const targetEntry = entries.find(e => {
                if (entryId && e.id) return String(e.id) === String(entryId);
                return Number(e.timestamp) === Number(timestamp);
            });
            if (!targetEntry) return;

            if (!targetEntry.comments) targetEntry.comments = [];
            targetEntry.comments.push(commentObj);

            saveToLocalStorage();
            renderEntries();

            if (window.isCloudMode && supabaseClient && targetEntry.id) {
                try {
                    await supabaseClient
                        .from('journal_entries')
                        .update({ comments: targetEntry.comments })
                        .eq('id', targetEntry.id);
                } catch (err) {
                    console.warn("댓글 클라우드 동기화 실패:", err);
                }
            }
        }

        async function deleteComment(entryId, timestamp, commentId) {
            const targetEntry = entries.find(e => {
                if (entryId && e.id) return String(e.id) === String(entryId);
                return Number(e.timestamp) === Number(timestamp);
            });
            if (!targetEntry || !targetEntry.comments) return;

            targetEntry.comments = targetEntry.comments.filter(c => String(c.id) !== String(commentId));

            saveToLocalStorage();
            renderEntries();

            if (window.isCloudMode && supabaseClient && targetEntry.id) {
                try {
                    await supabaseClient
                        .from('journal_entries')
                        .update({ comments: targetEntry.comments })
                        .eq('id', targetEntry.id);
                } catch (err) {
                    console.warn("댓글 삭제 클라우드 동기화 실패:", err);
                }
            }
        }

        // -------------------------------------------------------------
        // 화면 렌더링
        // -------------------------------------------------------------
        function renderEntries() {
            const container = document.getElementById('entriesContainer');
            if (!container) return;
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-300"></i>
                        <p class="text-base font-medium">아직 등록된 일기가 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-0.5">오늘의 첫 일기를 남겨보세요!</p>
                    </div>
                `;
                return;
            }

            entries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm flex flex-col gap-2.5 hover:shadow-md transition-shadow';

                const author = entry.author || { name: '가족', icon: 'fa-user', bgLight: 'bg-slate-50', text: 'text-slate-600', border: 'border-slate-300' };
                const entryKey = entry.id || entry.timestamp;
                const isInputOpen = openCommentBoxes[entryKey] || false;

                // 글쓴이 이름 바로 옆 태그 배치
                let tagsInlineHTML = '';
                if (entry.tags && entry.tags.length > 0) {
                    tagsInlineHTML = entry.tags.map(t => `<span class="px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[10px] font-semibold">${t}</span>`).join(' ');
                }

                // 본문 클릭 시 작성창 토글
                let contentBodyHTML = `
                    <div class="flex gap-3 items-start cursor-pointer group" onclick="toggleCommentInput('${entryKey}')" title="클릭하여 댓글 작성 창 열기/닫기">
                        <div class="flex-1">
                            <p class="text-slate-700 text-base font-normal leading-relaxed whitespace-pre-wrap group-hover:text-indigo-900 transition-colors">${entry.content}</p>
                        </div>
                        ${entry.imageUrl ? `
                            <div class="w-20 h-20 shrink-0 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 hover:opacity-90 transition-opacity" onclick="event.stopPropagation(); openPhotoModal('${entry.imageUrl}')">
                                <img src="${entry.imageUrl}" alt="일기 사진" class="w-full h-full object-cover">
                            </div>
                        ` : ''}
                    </div>
                `;

                // 댓글 목록 항상 표시
                let commentsHTML = '';
                if (entry.comments && entry.comments.length > 0) {
                    commentsHTML = `
                        <div class="flex flex-col gap-1 border-t border-slate-100 pt-2">
                            ${entry.comments.map(c => {
                                const cAuthor = c.author || { name: '가족', text: 'text-slate-600' };
                                return `
                                    <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-lg px-2.5 py-1.5 text-xs">
                                        <div class="flex items-center gap-1.5 flex-1 min-w-0">
                                            <span class="font-bold text-slate-700 shrink-0">${cAuthor.name}:</span>
                                            ${c.emoji ? `<span class="text-sm shrink-0">${c.emoji}</span>` : ''}
                                            ${c.text ? `<span class="text-slate-600 truncate">${c.text}</span>` : ''}
                                        </div>
                                        <button onclick="deleteComment('${entry.id || ''}', ${entry.timestamp}, ${c.id})" class="text-slate-300 hover:text-rose-500 p-0.5 ml-1 transition-colors" title="댓글 삭제">
                                            <i class="fa-solid fa-xmark text-xs"></i>
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                const currentSelectedEmoji = selectedCommentEmojis[entryKey] || '';

                // 반응 버튼 (알통 제거, 엄지 아래 👎 포함)
                let commentInputSectionHTML = `
                    <div class="${isInputOpen ? 'flex flex-col gap-2 pt-2 border-t border-slate-100' : 'hidden'}">
                        <div class="flex items-center gap-1.5">
                            <div class="flex items-center gap-0.5 bg-slate-50 p-1 rounded-lg border border-slate-200">
                                ${REACTION_ICONS.map(emoji => `
                                    <button onclick="selectCommentEmoji('${entryKey}', '${emoji}')" class="w-6 h-6 flex items-center justify-center rounded text-xs transition-transform ${currentSelectedEmoji === emoji ? 'bg-indigo-100 border border-indigo-300 scale-110 shadow-sm' : 'hover:bg-slate-200/60'}">
                                        ${emoji}
                                    </button>
                                `).join('')}
                            </div>
                            <input type="text" id="commentInput_${entryKey}" placeholder="댓글 남기기..." class="flex-1 px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') addComment('${entry.id || ''}', ${entry.timestamp})">
                            <button onclick="addComment('${entry.id || ''}', ${entry.timestamp})" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg shadow-sm shrink-0 transition-colors">
                                등록
                            </button>
                        </div>
                    </div>
                `;

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-full ${author.bgLight} ${author.text} flex items-center justify-center text-xs font-bold border ${author.border}">
                                <i class="fa-solid ${author.icon}"></i>
                            </span>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-bold text-slate-800 text-sm">${author.name}</span>
                                ${tagsInlineHTML}
                                <span class="text-[11px] text-slate-400 block w-full">${entry.dateTimeStr || ''}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-0.5">
                            <button onclick="editEntry('${entry.id || ''}', ${entry.timestamp})" class="text-slate-400 hover:text-indigo-600 p-1 transition-colors" title="수정">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteEntry('${entry.id || ''}', ${entry.timestamp})" class="text-slate-300 hover:text-rose-500 p-1 transition-colors" title="삭제">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>

                    ${contentBodyHTML}
                    ${commentsHTML}
                    ${commentInputSectionHTML}
                `;

                container.appendChild(card);
            });
        }

        // -------------------------------------------------------------
        // 사진 확대 모달
        // -------------------------------------------------------------
        function openPhotoModal(imgSrc) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImage');
            if (modal && modalImg) {
                modalImg.src = imgSrc;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closePhotoModal() {
            const modal = document.getElementById('photoModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-['Noto_Sans_KR'] antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-lg border-x border-slate-200">
        
        <!-- Header -->
        <header class="bg-white px-3.5 py-2.5 border-b border-slate-200 sticky top-0 z-10 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-indigo-100 shadow-sm">
                    <i class="fa-solid fa-book-open text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-800 tracking-tight leading-none">서둥이네 한줄 일기장</h1>
                    <p class="text-[11px] text-slate-400 mt-0.5">우리 가족 하루 기록하기</p>
                </div>
            </div>

            <!-- 실시간 상태 표시 뱃지 -->
            <div class="flex items-center gap-1.5">
                <button id="notifToggleBtn" class="w-7 h-7 rounded-full text-slate-400 bg-slate-50 border border-slate-200 flex items-center justify-center hover:bg-slate-100 transition-colors" title="알림">
                    <i class="fa-solid fa-bell-slash text-xs"></i>
                </button>
                <div id="cloudStatusBadge" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold border border-slate-200 shadow-sm" title="연결 확인 중">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 p-2.5 flex flex-col gap-2.5">
            
            <!-- 작성자 선택 -->
            <section class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                <label class="block text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1">
                    <i class="fa-solid fa-user-tag text-indigo-500"></i> 작성자 선택
                </label>
                <div id="authorSelector" class="flex gap-1.5"></div>
            </section>

            <!-- 일시 및 날씨 -->
            <section class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-xs font-semibold text-slate-600">
                <div class="flex items-center gap-1.5 text-sm">
                    <i class="fa-regular fa-calendar-days text-indigo-500 text-base"></i>
                    <span id="currentDateTime">2026.11.08(일) 00:00</span>
                </div>
                <div id="weatherInfo" class="flex items-center gap-1 text-slate-600">
                    <i class="fa-solid fa-sun text-amber-500"></i> <span>맑음</span>
                </div>
            </section>

            <!-- 기분 & 활동 콤보박스 -->
            <section class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                <label class="block text-xs font-bold text-slate-500 flex items-center gap-1">
                    <i class="fa-solid fa-face-smile text-amber-500"></i> 기분 & 활동 선택
                </label>
                <select id="tagComboSelect" onchange="handleTagSelect(event)" class="w-full p-2.5 rounded-lg border border-slate-300 text-slate-700 bg-slate-50 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
                <div id="selectedTagsContainer" class="flex flex-wrap gap-1.5 min-h-[24px] items-center"></div>
            </section>

            <!-- 일기 입력 서식 -->
            <section class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                <textarea id="journalContent" rows="3" placeholder="오늘 어떤 일이 있었나요? 한 줄로 남겨보세요..." class="w-full p-2.5 rounded-lg border border-slate-200 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                
                <!-- 사진 미리보기 -->
                <div id="photoPreviewContainer" class="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-200 hidden">
                    <img id="photoPreview" src="" alt="미리보기" class="w-full h-full object-cover">
                    <button type="button" onclick="removePhoto()" class="absolute top-1 right-1 w-5 h-5 bg-black/60 text-white rounded-full flex items-center justify-center text-xs hover:bg-black/80">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- 하단 버튼들 -->
                <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
                    <label class="flex-1 py-2.5 px-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-camera text-indigo-500 text-sm"></i> 사진 추가
                        <input type="file" id="photoInput" accept="image/*" onchange="handleImageSelect(event)" class="hidden">
                    </label>
                    <button id="submitBtn" onclick="saveEntry()" class="flex-[2] py-2.5 px-3 rounded-xl bg-indigo-600 text-white font-bold text-sm flex items-center justify-center gap-1.5 shadow-indigo-100 shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
                        <i class="fa-solid fa-paper-plane text-xs"></i> 등록하기
                    </button>
                </div>
            </section>

            <!-- 일기 목록 -->
            <section id="entriesContainer" class="flex flex-col gap-2.5 pb-6">
                <!-- JS로 동적 생성됨 -->
            </section>
        </main>
    </div>

    <!-- 사진 확대 모달 -->
    <div id="photoModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4" onclick="closePhotoModal()">
        <div class="relative max-w-lg w-full bg-transparent flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closePhotoModal()" class="absolute -top-10 right-0 text-white hover:text-slate-300 text-2xl font-bold p-1 focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modalImage" src="" alt="확대된 사진" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain border border-white/20">
        </div>
    </div>
</body>
</html>
