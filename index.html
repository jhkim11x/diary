<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & 풀스크린(주소창 제거) 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="서둥이네 일기장">
    <meta name="theme-color" content="#4f46e5">

    <title>서둥이네 한줄 일기장</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .active-author {
            border-color: #4f46e5 !important;
            background-color: #eeefff !important;
            color: #4f46e5 !important;
            font-weight: 700;
        }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- 상단 헤더 -->
        <header class="bg-white border-b px-4 py-3 sticky top-0 z-50 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">
                    📖
                </div>
                <div>
                    <h1 class="font-bold text-base text-gray-800 leading-none">서둥이네 한줄 일기장</h1>
                    <p class="text-xs text-gray-400 mt-0.5">우리 가족 하루 기록하기</p>
                </div>
            </div>
            
            <!-- 상단 오른쪽 알림 및 실시간 공유 아이콘 -->
            <div class="flex items-center space-x-2">
                <button id="notifBtn" onclick="toggleNotification()" class="p-2 rounded-full bg-gray-100 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" title="알림 설정">
                    <i id="notifIcon" class="fa-solid fa-bell-slash text-base"></i>
                </button>
                <div id="cloudStatus" class="p-2 rounded-full bg-gray-100 flex items-center justify-center" title="실시간 공유 중">
                    <span id="cloudDot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 p-3 space-y-3">
            
            <!-- 작성자 선택 -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-gray-100">
                <label class="block text-xs font-semibold text-gray-500 mb-2">
                    <i class="fa-solid fa-user-group text-indigo-500 mr-1"></i>작성자 선택
                </label>
                <div id="authorList" class="grid grid-cols-3 gap-2">
                    <!-- 자바스크립트로 동적 생성 -->
                </div>
            </section>

            <!-- 날짜 및 날씨 -->
            <section class="bg-white rounded-xl px-3 py-2.5 shadow-sm border border-gray-100 flex justify-between items-center text-xs text-gray-600">
                <div class="flex items-center space-x-1.5 font-medium">
                    <i class="fa-regular fa-calendar-days text-indigo-500"></i>
                    <span id="currentDateTime">--.--.--(--) --:--</span>
                </div>
                <div class="flex items-center space-x-1 font-medium text-amber-500">
                    <span id="weatherIcon">☀️</span>
                    <span id="weatherText" class="ml-1 text-gray-600">맑음</span>
                </div>
            </section>

            <!-- 기분 & 활동 선택 -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-gray-100">
                <label class="block text-xs font-semibold text-gray-500 mb-2">
                    <i class="fa-solid fa-face-smile text-amber-500 mr-1"></i>기분 & 활동 선택
                </label>
                <select id="moodSelect" class="w-full text-xs bg-gray-50 border border-gray-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 text-gray-700 font-medium">
                    <option value="">오늘의 기분/활동을 선택해 보세요 👇</option>
                    <option value="행복 😊">행복 😊</option>
                    <option value="슬픔 😢">슬픔 😢</option>
                    <option value="서운 🥺">서운 🥺</option>
                    <option value="즐거움 😆">즐거움 😆</option>
                    <option value="평온함 😌">평온함 😌</option>
                    <option value="피곤함 🥱">피곤함 🥱</option>
                    <option value="신남 🥳">신남 🥳</option>
                    <option value="맛있는 식사 🍕">맛있는 식사 🍕</option>
                    <option value="가족 나들이 🚗">가족 나들이 🚗</option>
                    <option value="휴식 중 ☕">휴식 중 ☕</option>
                    <option value="운동 완료 🏃">운동 완료 🏃</option>
                </select>
            </section>

            <!-- 일기 작성창 -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-gray-500">
                        <i class="fa-solid fa-pen-to-square text-indigo-500 mr-1"></i>오늘 일기쓰기
                    </label>
                    <span class="text-[10px] text-indigo-400 font-normal">* 하루 한 장 사진 첨부 가능</span>
                </div>

                <textarea id="journalInput" rows="3" placeholder="오늘 어떤 일이 있었나요? 편하게 적어보세요..." class="w-full text-xs p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-indigo-500 resize-none text-gray-800 placeholder-gray-400"></textarea>

                <!-- 사진 미리보기 (작은 썸네일) -->
                <div id="photoPreviewContainer" class="hidden relative inline-block">
                    <img id="photoPreview" class="w-16 h-16 object-cover rounded-lg border border-gray-200 shadow-sm" src="" alt="미리보기">
                    <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-red-500 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center shadow">✕</button>
                </div>

                <!-- 버튼 영역 -->
                <div class="flex space-x-2">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
                    <button onclick="document.getElementById('photoInput').click()" class="flex-1 py-2.5 bg-gray-50 border border-gray-200 text-gray-600 rounded-lg text-xs font-medium flex items-center justify-center space-x-1 hover:bg-gray-100">
                        <i class="fa-solid fa-camera text-indigo-500"></i>
                        <span>사진 첨부</span>
                    </button>
                    <button id="submitBtn" onclick="saveEntry()" class="flex-[2] py-2.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-1 shadow-sm hover:bg-indigo-700">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span id="submitBtnText">등록하기</span>
                    </button>
                </div>
            </section>

            <!-- 일기 목록 섹션 -->
            <section class="space-y-2.5">
                <div class="flex justify-between items-center px-1 pt-1">
                    <h2 class="text-xs font-bold text-gray-500">
                        <i class="fa-solid fa-book-open text-indigo-500 mr-1"></i>우리 가족 일기 목록
                    </h2>
                    <button onclick="loadRemoteData()" class="text-[11px] text-indigo-600 font-medium hover:underline">
                        🔄 새로고침
                    </button>
                </div>
                <div id="entriesList" class="space-y-2">
                    <!-- 동적 생성 -->
                </div>
            </section>
        </main>
    </div>

    <script>
        const AUTHORS = [
            { name: '아빠', icon: '👨' },
            { name: '엄마', icon: '👩' },
            { name: '딸', icon: '👧' }
        ];

        let selectedAuthor = '아빠';
        let attachedPhotoBase64 = null;
        let editingEntryId = null;
        let entries = [];
        let lastKnownEntryCount = 0;

        // 무료 공개 공유 데이터베이스 (서둥이네 동기화 전용 키)
        const BIN_ID = "6741b244ad19ca34f8cf1032"; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        window.addEventListener('DOMContentLoaded', () => {
            initAuthorButtons();
            updateClock();
            setInterval(updateClock, 1000);
            checkNotificationPermission();
            
            // 데이터 로드 및 5초마다 자동 실시간 동기화
            loadRemoteData();
            setInterval(loadRemoteData, 5000);
        });

        function initAuthorButtons() {
            const container = document.getElementById('authorList');
            container.innerHTML = AUTHORS.map(author => `
                <button type="button" onclick="selectAuthor('${author.name}')" id="author-btn-${author.name}" 
                    class="py-2 px-3 border border-gray-200 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition ${author.name === selectedAuthor ? 'active-author' : 'bg-gray-50 text-gray-600'}">
                    <span>${author.icon}</span>
                    <span>${author.name}</span>
                </button>
            `).join('');
        }

        function selectAuthor(name) {
            selectedAuthor = name;
            AUTHORS.forEach(a => {
                const btn = document.getElementById(`author-btn-${a.name}`);
                if (btn) {
                    if (a.name === name) btn.classList.add('active-author');
                    else btn.classList.remove('active-author');
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}(${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const el = document.getElementById('currentDateTime');
            if (el) el.textContent = dateStr;
        }

        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max_size = 500;

                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    attachedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('photoPreview').src = attachedPhotoBase64;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            attachedPhotoBase64 = null;
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        // 실시간 클라우드 데이터 읽기 (엄마, 딸, 아빠 공용)
        async function loadRemoteData() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { "X-Bin-Meta": "false" }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        // 다른 가족이 새 글을 올렸을 때 알림 띄우기
                        if (lastKnownEntryCount > 0 && data.length > lastKnownEntryCount) {
                            const latest = data[0];
                            if (latest && latest.author !== selectedAuthor) {
                                triggerPushNotification(`📝 ${latest.author}님의 새 일기!`, latest.content);
                            }
                        }
                        entries = data;
                        lastKnownEntryCount = data.length;
                        saveToLocalBackup();
                        renderEntries();
                        return;
                    }
                }
            } catch (err) {
                console.log("클라우드 읽기 대기중, 로컬 데이터 불러오기");
            }
            loadFromLocalBackup();
        }

        // 실시간 클라우드 데이터 저장 (가족 공동 DB 전송)
        async function syncRemoteData() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entries)
                });
            } catch (err) {
                console.error("클라우드 동기화 실패:", err);
            }
        }

        async function saveEntry() {
            const content = document.getElementById('journalInput').value.trim();
            const mood = document.getElementById('moodSelect').value;

            if (!content) {
                alert('일기 내용을 입력해 주세요!');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if (editingEntryId) {
                const idx = entries.findIndex(e => String(e.id) === String(editingEntryId));
                if (idx !== -1) {
                    entries[idx].author = selectedAuthor;
                    entries[idx].content = content;
                    entries[idx].mood = mood;
                    if (attachedPhotoBase64) entries[idx].photo = attachedPhotoBase64;
                }
                editingEntryId = null;
                document.getElementById('submitBtnText').textContent = '등록하기';
            } else {
                const newEntry = {
                    id: Date.now().toString(),
                    author: selectedAuthor,
                    content: content,
                    mood: mood,
                    photo: attachedPhotoBase64,
                    date: dateStr,
                    timestamp: now.getTime()
                };
                entries.unshift(newEntry);
            }

            saveToLocalBackup();
            renderEntries();
            await syncRemoteData();

            // 입력창 초기화
            document.getElementById('journalInput').value = '';
            document.getElementById('moodSelect').value = '';
            removePhoto();
        }

        function renderEntries() {
            const container = document.getElementById('entriesList');
            if (!container) return;

            if (!entries || entries.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-6 text-center text-gray-400 text-xs shadow-sm border border-gray-100">
                        아직 작성된 일기가 없습니다.<br>첫 일기를 남겨보세요! ✏️
                    </div>
                `;
                return;
            }

            container.innerHTML = entries.map(item => {
                // 작성자 문자열/객체 세이프 처리 ([object Object] 오류 방지)
                let authorName = typeof item.author === 'object' ? (item.author.name || '가족') : item.author;
                if (!authorName) authorName = '가족';

                const authorObj = AUTHORS.find(a => a.name === authorName);
                const icon = authorObj ? authorObj.icon : '👤';

                return `
                    <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <div class="flex items-center space-x-1.5 font-bold text-gray-700">
                                <span>${icon}</span>
                                <span>${authorName}</span>
                                ${item.mood ? `<span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded ml-1 font-normal">${item.mood}</span>` : ''}
                            </div>
                            <div class="flex items-center space-x-2 text-gray-400 text-[11px]">
                                <span>${item.date || ''}</span>
                                <button onclick="editEntry('${item.id}')" class="text-indigo-500 hover:text-indigo-700 font-medium p-1">✏️</button>
                                <button onclick="deleteEntry('${item.id}')" class="text-red-400 hover:text-red-600 font-medium p-1">✕</button>
                            </div>
                        </div>

                        <div class="flex items-start space-x-2.5 pt-1">
                            <div class="flex-1 text-xs text-gray-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</div>
                            ${item.photo ? `
                                <img src="${item.photo}" class="w-16 h-16 object-cover rounded-lg border border-gray-100 shadow-sm flex-shrink-0" alt="첨부 사진">
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editEntry(id) {
            const entry = entries.find(e => String(e.id) === String(id));
            if (!entry) return;

            editingEntryId = entry.id;
            const authorName = typeof entry.author === 'object' ? entry.author.name : entry.author;
            selectAuthor(authorName);
            
            document.getElementById('journalInput').value = entry.content || '';
            document.getElementById('moodSelect').value = entry.mood || '';

            if (entry.photo) {
                attachedPhotoBase64 = entry.photo;
                document.getElementById('photoPreview').src = entry.photo;
                document.getElementById('photoPreviewContainer').classList.remove('hidden');
            } else {
                removePhoto();
            }

            document.getElementById('submitBtnText').textContent = '수정 완료';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteEntry(id) {
            if (confirm('이 일기를 정말 삭제하시겠습니까?')) {
                entries = entries.filter(e => String(e.id) !== String(id));
                saveToLocalBackup();
                renderEntries();
                await syncRemoteData();
            }
        }

        function saveToLocalBackup() {
            localStorage.setItem('seodung_journal_entries', JSON.stringify(entries));
        }

        function loadFromLocalBackup() {
            const local = localStorage.getItem('seodung_journal_entries');
            if (local) {
                try {
                    entries = JSON.parse(local);
                    renderEntries();
                } catch (e) {}
            }
        }

        function escapeHtml(text) {
            return text ? String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        // --- 푸시 알림 제어 ---
        function checkNotificationPermission() {
            const icon = document.getElementById('notifIcon');
            const btn = document.getElementById('notifBtn');
            if (Notification.permission === 'granted') {
                if (icon) icon.className = 'fa-solid fa-bell text-base text-indigo-600';
                if (btn) btn.className = 'p-2 rounded-full bg-indigo-50 text-indigo-600 transition';
            } else {
                if (icon) icon.className = 'fa-solid fa-bell-slash text-base text-gray-400';
                if (btn) btn.className = 'p-2 rounded-full bg-gray-100 text-gray-400 transition';
            }
        }

        function toggleNotification() {
            if (!("Notification" in window)) {
                alert("이 브라우저는 웹 알림을 지원하지 않습니다.");
                return;
            }

            if (Notification.permission === "granted") {
                alert("🔔 알림이 정상 설정되어 있습니다! 다른 가족이 작성하면 팝업 알림이 옵니다.");
            } else {
                Notification.requestPermission().then(permission => {
                    checkNotificationPermission();
                    if (permission === "granted") {
                        triggerPushNotification("🔔 알림 설정 완료!", "이제 서둥이네 새 일기 작성 알림이 전송됩니다.");
                    } else {
                        alert("알림 허용이 거부되었습니다. 핸드폰 설정에서 알림 권한을 켜주세요.");
                    }
                });
            }
        }

        function triggerPushNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, {
                    body: body,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3237/3237472.png'
                });
            }
        }
    </script>
</body>
</html>
