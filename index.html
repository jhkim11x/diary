<script>

​// 동각 시계 업데이트
function updateDateTime() {
const now = new Date();
const days = ['일', '월', '화', '수', '목', '금', '토'];
const year = now.getFullYear();
const month = String(now.getMonth() + 1).padStart(2, '0');
const date = String(now.getDate()).padStart(2, '0');
const day = days[now.getDay()];
const hours = String(now.getHours()).padStart(2, '0');
const minutes = String(now.getMinutes()).padStart(2, '0');
​const element = document.getElementById('currentDateTime');
if (element) {
element.textContent = ${year}.${month}.${date}(${day}) ${hours}:${minutes};
}
}
updateDateTime();
setInterval(updateDateTime, 1000);
​function selectAuthor(authorId) {
selectedAuthor = authorId;
initAuthorSelector();
}
​function initAuthorSelector() {
const container = document.getElementById('authorSelector');
if (!container) return;
container.innerHTML = '';
​AUTHORS.forEach(author => {
const isSelected = author.id === selectedAuthor;
const btn = document.createElement('button');
btn.type = 'button';
btn.className = flex-1 py-2 px-2.5 rounded-xl border flex items-center justify-center gap-1.5 font-bold text-xs transition-all ${ isSelected  ? ${author.color} text-white border-transparent shadow-sm scale-102 :bg-white ${author.text} border-slate-200 hover:bg-slate-50 };
btn.innerHTML = <i class="fa-solid ${author.icon}"></i> ${author.name};
btn.onclick = () => selectAuthor(author.id);
container.appendChild(btn);
});
}
initAuthorSelector();
​async function fetchWeather() {
const weatherEl = document.getElementById('weatherInfo');
if (!weatherEl) return;
try {
const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
const data = await res.json();
if (data && data.current_weather) {
const temp = Math.round(data.current_weather.temperature);
const code = data.current_weather.weathercode;
let icon = 'fa-sun text-amber-500';
let text = '맑음';
if (code > 0 && code <= 3) { icon = 'fa-cloud-sun text-slate-400'; text = '구름조금'; }
else if (code > 3 && code < 60) { icon = 'fa-cloud text-slate-500'; text = '흐림'; }
else if (code >= 60) { icon = 'fa-umbrella text-blue-500'; text = '비'; }
​weatherEl.innerHTML = <i class="fa-solid ${icon}"></i> <span>${text} ${temp}°C</span>;
}
} catch (e) {
weatherEl.innerHTML = <i class="fa-solid fa-sun text-amber-500"></i> <span>맑음 20°C</span>;
}
}
fetchWeather();
​function handleTagSelect(event) {
const val = event.target.value;
if (val && !selectedTags.includes(val)) {
selectedTags.push(val);
renderSelectedTags();
}
event.target.value = '';
}
​function removeTag(tagToRemove) {
selectedTags = selectedTags.filter(t => t !== tagToRemove);
renderSelectedTags();
}
​function renderSelectedTags() {
const container = document.getElementById('selectedTagsContainer');
if (!container) return;
container.innerHTML = '';
selectedTags.forEach(tag => {
const badge = document.createElement('span');
badge.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-200";
badge.innerHTML = ${tag} <i class="fa-solid fa-xmark cursor-pointer hover:text-rose-500" onclick="removeTag('${tag}')"></i>;
container.appendChild(badge);
});
}
​function toggleNotification() {
if (!("Notification" in window)) {
alert("이 브라우저는 웹 알림을 지원하지 않습니다.");
return;
}
​if (Notification.permission === "granted") {
notifEnabled = !notifEnabled;
renderNotifBtn(notifEnabled);
alert(notifEnabled ? "알림이 켜졌습니다! 🔔" : "알림이 꺼졌습니다. 🔕");
} else if (Notification.permission === "denied") {
alert("브라우저 설정에서 알림 허용을 ON으로 켜주세요!");
} else {
Notification.requestPermission().then(permission => {
if (permission === "granted") {
notifEnabled = true;
renderNotifBtn(true);
alert("알림 설정이 정상 완료되었습니다! 🔔");
} else {
notifEnabled = false;
renderNotifBtn(false);
}
});
}
}
​function renderNotifBtn(isEnabled) {
const btn = document.getElementById('notifToggleBtn');
if (!btn) return;
if (isEnabled) {
btn.className = "w-7 h-7 rounded-full text-emerald-600 bg-emerald-50 border border-emerald-200 flex items-center justify-center hover:bg-emerald-100 transition-colors shadow-sm cursor-pointer";
btn.innerHTML = <i class="fa-solid fa-bell text-xs"></i>;
btn.title = "알림 켜짐";
} else {
btn.className = "w-7 h-7 rounded-full text-slate-400 bg-slate-50 border border-slate-200 flex items-center justify-center hover:bg-slate-100 transition-colors cursor-pointer";
btn.innerHTML = <i class="fa-solid fa-bell-slash text-xs"></i>;
btn.title = "알림 꺼짐";
}
}
​if ("Notification" in window && Notification.permission === "granted") {
notifEnabled = true;
renderNotifBtn(true);
}
​function sendWebPushNotification(authorName, textContent) {
if ("Notification" in window && Notification.permission === "granted" && notifEnabled) {
const title = 📝 서둥이네 일기장;
const options = {
body: ${authorName}님이 새 일기를 등록했습니다!\n"${textContent ? textContent.slice(0, 30) : '사진 첨부됨'}...",
icon: 'https://cdn-icons-png.flaticon.com/512/3237/3237472.png'
};
try { new Notification(title, options); } catch (e) {}
}
}
​function handleImageSelect(event) {
const file = event.target.files[0];
if (!file) return;
​const reader = new FileReader();
reader.onload = function(e) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement('canvas');
let width = img.width;
let height = img.height;
const maxDim = 800;
​if (width > maxDim || height > maxDim) {
if (width > height) {
height = Math.round((height * maxDim) / width);
width = maxDim;
} else {
width = Math.round((width * maxDim) / height);
height = maxDim;
}
}
​canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, width, height);
​currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
​const previewImg = document.getElementById('photoPreview');
const previewContainer = document.getElementById('photoPreviewContainer');
if (previewImg && previewContainer) {
previewImg.src = currentPhotoBase64;
previewContainer.classList.remove('hidden');
}
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}
​function removePhoto() {
currentPhotoBase64 = null;
const previewContainer = document.getElementById('photoPreviewContainer');
const fileInput = document.getElementById('photoInput');
if (previewContainer) previewContainer.classList.add('hidden');
if (fileInput) fileInput.value = '';
}
​async function initCloudAndEntries() {
try {
if (window.supabase && typeof window.supabase.createClient === 'function') {
supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
isCloudMode = true;
​supabaseClient
.channel('public:journal_entries')
.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'journal_entries' }, payload => {
const newEntry = payload.new;
if (newEntry) {
const authorName = newEntry.author ? newEntry.author.name : '가족';
if (authorName !== selectedAuthor) {
sendWebPushNotification(authorName, newEntry.content || '');
}
loadEntries();
}
})
.subscribe();
}
} catch (e) {
isCloudMode = false;
}
​await loadEntries();
}
​async function loadEntries() {
if (isCloudMode && supabaseClient) {
try {
const { data, error } = await supabaseClient
.from('journal_entries')
.select('*')
.order('timestamp', { ascending: false });
​if (!error && data) {
entries = data;
renderEntries();
return;
}
} catch (err) {
console.warn("로컬 모드로 전환:", err);
}
}
​const local = localStorage.getItem('seodung_journal_entries');
entries = local ? JSON.parse(local) : [];
renderEntries();
}
​function editEntry(id, timestamp) {

if (!entry) return;
​editingEntryId = id || timestamp;
selectedAuthor = entry.author ? entry.author.id : '아빠';
selectedTags = entry.tags ? [...entry.tags] : [];
currentPhotoBase64 = entry.imageUrl || null;
​const contentInput = document.getElementById('journalContent');
if (contentInput) contentInput.value = entry.content || '';
​initAuthorSelector();
renderSelectedTags();
​const previewImg = document.getElementById('photoPreview');
const previewContainer = document.getElementById('photoPreviewContainer');
if (currentPhotoBase64 && previewImg && previewContainer) {
previewImg.src = currentPhotoBase64;
previewContainer.classList.remove('hidden');
} else if (previewContainer) {
previewContainer.classList.add('hidden');
}
​const submitBtn = document.getElementById('submitBtn');

submitBtn.innerHTML = <i class="fa-solid fa-check text-lg"></i> 수정 완료;
submitBtn.className = "flex-[2] py-2.5 px-3 rounded-xl bg-amber-500 text-white font-bold text-sm flex items-center justify-center gap-1.5 shadow-amber-100 shadow-md hover:bg-amber-600 active:scale-95 transition-all";

}

const dtText = document.getElementById('currentDateTime')?.textContent || '';

if (targetEntry) {
targetEntry.author = authorObj;
targetEntry.tags = [...selectedTags];
targetEntry.content = content;
targetEntry.imageUrl = currentPhotoBase64;
​if (isCloudMode && supabaseClient && targetEntry.id) {
try {
await supabaseClient
.from('journal_entries')
.update({
author: authorObj,
tags: [...selectedTags],
content: content,
imageUrl: currentPhotoBase64
})
.eq('id', targetEntry.id);
} catch (err) {
console.error("클라우드 수정 오류:", err);
}
}
saveToLocalStorage();
}
cancelEdit();
renderEntries();
return;
}
​const newEntry = {
timestamp: Date.now(),
author: authorObj,
dateTimeStr: dtText,
tags: [...selectedTags],
content: content,
imageUrl: currentPhotoBase64
};
​if (isCloudMode && supabaseClient) {
try {
const { data, error } = await supabaseClient
.from('journal_entries')
.insert([newEntry])

​function downloadBackup() {

document.body.appendChild(downloadAnchor);

}
​function uploadBackup(event) {
const file = event.target.files[0];
if (!file) return;
​const reader = new FileReader();
reader.onload = function(e) {
try {
const importedEntries = JSON.parse(e.target.result);
if (Array.isArray(importedEntries)) {
entries = importedEntries;
saveToLocalStorage();
renderEntries();
alert("백업 데이터를 정상적으로 불러왔습니다!");
} else {
alert("올바르지 않은 백업 데이터 형식입니다.");
}
} catch (err) {

}
};
reader.readAsText(file);
}
