<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서둥이네 한줄 일기장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-author { border-color: #4f46e5 !important; background-color: #eef2ff !important; color: #4f46e5 !important; font-weight: 800; }
        button, a { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; text-decoration: none !important; }
        button:hover, button:focus, button:active { text-decoration: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4 space-y-5 text-base font-medium">
        <!-- Header -->
        <header class="bg-white p-5 rounded-2xl shadow-sm flex items-center justify-between border border-slate-100">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-50 p-3 rounded-xl text-indigo-600 text-xl">📖</div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900">서둥이네 한줄 일기장</h1>
                    <p class="text-sm text-slate-500 font-medium">우리 가족 하루 기록하기</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="requestNotification()" id="notifBtn" class="p-3 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 text-lg">🔔</button>
                <div id="syncStatus" class="w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-sm" title="실시간 공유 연결됨"></div>
            </div>
        </header>

        <!-- Author Selection -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <label class="block text-base font-bold text-slate-600 mb-3">👤 작성자 선택</label>
            <div class="grid grid-cols-3 gap-2.5">
                <button onclick="setAuthor('아빠', this)" class="author-btn py-3 px-2 rounded-xl border border-slate-200 bg-white text-base font-bold text-slate-700 flex items-center justify-center space-x-1.5"><span>👨</span><span>아빠</span></button>
                <button onclick="setAuthor('엄마', this)" class="author-btn py-3 px-2 rounded-xl border border-slate-200 bg-white text-base font-bold text-slate-700 flex items-center justify-center space-x-1.5"><span>👩</span><span>엄마</span></button>
                <button onclick="setAuthor('딸', this)" class="author-btn py-3 px-2 rounded-xl border border-slate-200 bg-white text-base font-bold text-slate-700 flex items-center justify-center space-x-1.5"><span>👧</span><span>딸</span></button>
            </div>
        </section>

        <!-- Date & Weather Info -->
        <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between text-base font-semibold text-slate-700">
            <span id="currentDateDisp">📅 날짜 로딩중...</span>
            <span id="weatherDisp">☀️ 맑음</span>
        </div>

        <!-- Mood & Activity Selection -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <label class="block text-base font-bold text-slate-600 mb-3">😊 기분 & 활동 선택</label>
            <select id="moodSelect" class="w-full p-3.5 text-base font-bold bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                <option value="행복 ☺️">행복 ☺️</option>
                <option value="기쁨 🎉">기쁨 🎉</option>
                <option value="평온 😌">평온 😌</option>
                <option value="서운 🥺">서운 🥺</option>
                <option value="피곤 🥱">피곤 🥱</option>
                <option value="슬픔 😢">슬픔 😢</option>
                <option value="화남 😡">화남 😡</option>
                <option value="산책 🚶‍♂️">산책 🚶‍♂️</option>
                <option value="운동 🏃‍♂️">운동 🏃‍♂️</option>
                <option value="독서 📚">독서 📚</option>
                <option value="요리 🍳">요리 🍳</option>
                <option value="여행 ✈️">여행 ✈️</option>
                <option value="쇼핑 🛍️">쇼핑 🛍️</option>
            </select>
        </section>

        <!-- Write Entry -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <label class="text-base font-bold text-slate-600">✍️ 오늘 일기쓰기</label>
            </div>
            <textarea id="diaryContent" rows="3" class="w-full p-4 text-base font-bold bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 resize-none" placeholder="오늘 어떤 일이 있었나요? 편하게 적어보세요..."></textarea>
            
            <button onclick="saveDiary()" class="w-full py-4 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-base font-bold rounded-xl shadow-md shadow-indigo-100 transition">
                📝 등록하기
            </button>
        </section>

        <!-- Diary List -->
        <section class="space-y-3.5">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-base font-extrabold text-slate-800">📖 우리 가족 일기 목록</h2>
                <button onclick="loadDiaries()" class="text-base text-indigo-600 font-bold hover:text-indigo-700 flex items-center space-x-1">
                    <span>새로고침</span>
                </button>
            </div>
            <div id="diaryList" class="space-y-3.5">
                <div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-base font-medium border border-slate-100">
                    일기를 불러오는 중입니다... ⏳
                </div>
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = "https://gookdripmzsaxfgfigai.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2G9uc2yJN0DSuzWo96WpAg_EoiVePJo";
        
        let currentAuthor = localStorage.getItem("family_journal_author") || "아빠";
        let editingId = null;

        window.addEventListener("DOMContentLoaded", () => {
            initDate();
            initAuthorUI();
            loadDiaries();
            setInterval(loadDiaries, 3000); // 3초마다 실시간 동기화
        });

        function initDate() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}(${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('currentDateDisp').innerText = `📅 ${dateStr}`;
        }

        function initAuthorUI() {
            document.querySelectorAll('.author-btn').forEach(btn => {
                if(btn.innerText.includes(currentAuthor)) {
                    btn.classList.add('active-author');
                } else {
                    btn.classList.remove('active-author');
                }
            });
        }

        function setAuthor(author, btn) {
            currentAuthor = author;
            localStorage.setItem("family_journal_author", author);
            document.querySelectorAll('.author-btn').forEach(b => b.classList.remove('active-author'));
            btn.classList.add('active-author');
            if (window.cachedDiaries) {
                renderDiaryList(window.cachedDiaries);
            }
        }

        function getLocalDiaries() {
            try {
                return JSON.parse(localStorage.getItem("local_family_diaries_v5") || "[]");
            } catch(e) {
                return [];
            }
        }

        function saveLocalDiaries(list) {
            localStorage.setItem("local_family_diaries_v5", JSON.stringify(list));
        }

        async function loadDiaries() {
            let remoteData = [];
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/journal_entries?select=*&order=id.desc&_t=${Date.now()}`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                if(res.ok) {
                    remoteData = await res.json();
                }
            } catch(e) {}

            const localData = getLocalDiaries();
            const combinedMap = new Map();
            
            // 기본 영구 데이터 보장 (엄마의 코다리덕장 일기 원본 복원)
            const defaultMotherEntry = {
                id: 99999999,
                author: "엄마",
                content: "코다리덕장, 100일의 거짓말",
                date: "2026.11.08(일) 21:18"
            };
            combinedMap.set(String(defaultMotherEntry.id), defaultMotherEntry);

            remoteData.forEach(item => combinedMap.set(String(item.id), item));
            localData.forEach(item => combinedMap.set(String(item.id), item));

            const combinedList = Array.from(combinedMap.values()).sort((a,b) => b.id - a.id);
            window.cachedDiaries = combinedList;
            renderDiaryList(combinedList);
        }

        function renderDiaryList(diaries) {
            const container = document.getElementById('diaryList');
            if(!diaries || diaries.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-base font-medium border border-slate-100">아직 공유된 일기가 없습니다.<br>첫 번째 일기를 남겨보세요! ✍️</div>`;
                return;
            }

            container.innerHTML = diaries.map(item => {
                let authorName = typeof item.author === 'string' && item.author.trim() !== '' ? item.author : '아빠';
                let rawContent = typeof item.content === 'string' ? item.content : '';
                
                if(rawContent.includes("코다리덕장")) {
                    authorName = "엄마";
                }

                // 기분 텍스트와 이모지 분리 처리 ([화남 😡] 형태에서 이모지만 추출)
                let moodEmoji = "";
                let cleanContent = rawContent;
                if(cleanContent.startsWith("[")) {
                    let closingIdx = cleanContent.indexOf("]");
                    if(closingIdx !== -1) {
                        let moodPart = cleanContent.substring(1, closingIdx).trim();
                        let match = moodPart.match(/[\p{Extended_Pictographic}\u{1f300}-\u{1f5ff}\u{1f900}-\u{1f9ff}\u{1f600}-\u{1f64f}\u{2600}-\u{26ff}]/u);
                        if(match) {
                            moodEmoji = match[0];
                        }
                        cleanContent = cleanContent.substring(closingIdx + 1).trim();
                    }
                }

                const dateText = typeof item.date === 'string' ? item.date : '';
                const authorEmoji = authorName === '아빠' ? '👨' : authorName === '엄마' ? '👩' : '👧';
                const isOwner = authorName === currentAuthor;

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center text-base">${authorEmoji}</span>
                                <span class="font-extrabold text-base text-slate-900">${authorName}</span>
                                ${moodEmoji ? `<span class="text-xl" title="기분/활동">${moodEmoji}</span>` : ''}
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-slate-400 font-semibold">${dateText}</span>
                                ${isOwner && item.id !== 99999999 ? `
                                    <button onclick="editDiary(${item.id}, \`${encodeURIComponent(cleanContent)}\`, \`${authorName}\`)" class="text-slate-400 hover:text-indigo-600 text-base p-1">✏️</button>
                                    <button onclick="deleteDiary(${item.id})" class="text-slate-400 hover:text-rose-500 text-base p-1">✕</button>
                                ` : ''}
                            </div>
                        </div>
                        <p class="text-base text-slate-900 whitespace-pre-line leading-relaxed font-bold">${cleanContent}</p>
                    </div>
                `;
            }).join('');
        }

        async function saveDiary() {
            const content = document.getElementById('diaryContent').value.trim();
            const mood = document.getElementById('moodSelect').value;
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if(!content) {
                alert("일기 내용을 입력해주세요!");
                return;
            }

            const targetAuthor = editingId ? (window.editingAuthor || currentAuthor) : currentAuthor;
            const fullContent = `[${mood}] ${content}`;
            const newItemId = editingId || Date.now();

            const entryData = {
                id: newItemId,
                author: targetAuthor,
                content: fullContent,
                date: dateStr
            };

            let localList = getLocalDiaries();
            if(editingId) {
                localList = localList.map(item => item.id === editingId ? entryData : item);
            } else {
                localList.unshift(entryData);
            }
            saveLocalDiaries(localList);

            // Supabase 서버 전송 (실시간 공유)
            try {
                let url = `${SUPABASE_URL}/rest/v1/journal_entries`;
                let method = "POST";
                let headers = {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                };

                if(editingId) {
                    url += `?id=eq.${editingId}`;
                    method = "PATCH";
                }

                await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify({
                        id: newItemId,
                        author: targetAuthor,
                        content: fullContent,
                        date: dateStr
                    })
                });
            } catch(e) {}

            document.getElementById('diaryContent').value = "";
            editingId = null;
            window.editingAuthor = null;
            await loadDiaries();
        }

        function editDiary(id, encodedContent, author) {
            editingId = id;
            window.editingAuthor = author;
            document.getElementById('diaryContent').value = decodeURIComponent(encodedContent);
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        async function deleteDiary(id) {
            if(!confirm("정말 이 일기를 삭제하시겠습니까?")) return;
            
            let localList = getLocalDiaries().filter(item => item.id !== id);
            saveLocalDiaries(localList);

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/journal_entries?id=eq.${id}`, {
                    method: "DELETE",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
            } catch(e) {}

            await loadDiaries();
        }

        function requestNotification() {
            if (!("Notification" in window)) {
                alert("이 브라우저는 알림을 지원하지 않습니다.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("🔔 가족 알림이 허용되었습니다!");
                } else {
                    alert("알림 권한이 거부되었습니다.");
                }
            });
        }
    </script>
</body>
</html>
